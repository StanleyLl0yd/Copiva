name: Read CodeQL metadata and alert counts
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Numeric validation artifact ID
        type: string
        default: '13844714158'
permissions: {}
jobs:
  metadata:
    name: Read analysis metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
    steps:
      - name: Read refs and counts without finding contents
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "StanleyLl0yd/Copiva":
              raise SystemExit("Unexpected repository")
          def api(path):
              result = subprocess.run(["gh", "api", path, "--paginate", "--slurp"],
                  capture_output=True, text=True, timeout=60)
              if result.returncode:
                  raise RuntimeError("Read-only security metadata endpoint unavailable")
              return [item for page in json.loads(result.stdout) for item in page]
          for ref in ("refs/pull/11/head", "refs/pull/12/head", "refs/pull/13/head", "refs/heads/main"):
              query = urllib.parse.urlencode({"ref": ref, "per_page": 100})
              analyses = api(f"repos/{repo}/code-scanning/analyses?{query}")
              latest = {}
              for analysis in analyses:
                  key = (analysis["tool"]["name"], analysis.get("category"))
                  latest.setdefault(key, analysis)
              safe = [{"sha": a["commit_sha"], "category": a.get("category"),
                       "results_count": a.get("results_count"),
                       "created_at": a["created_at"], "has_error": bool(a.get("error"))}
                      for a in latest.values()]
              alerts = api(f"repos/{repo}/code-scanning/alerts?state=open&{query}")
              blocking = [a for a in alerts if a["rule"].get("security_severity_level")
                          in ("medium", "high", "critical") or a["rule"].get("severity") == "error"]
              print(json.dumps({"ref": ref, "latest_analyses": safe,
                                "open_alerts": len(alerts), "blocking_alerts": len(blocking)}))
          PY
      - name: Verify validation artifact metadata without payload output
        run: |
          python3 - <<'PY'
          import io, json, os, re, subprocess, zipfile
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "StanleyLl0yd/Copiva":
              raise SystemExit("Unexpected repository")
          artifact_id = os.environ["ARTIFACT_ID"]
          if not re.fullmatch(r"[0-9]+", artifact_id):
              raise SystemExit("Unexpected artifact ID")
          result = subprocess.run(
              ["gh", "api", f"repos/{repo}/actions/artifacts/{artifact_id}/zip"],
              capture_output=True, check=True, timeout=60)
          with zipfile.ZipFile(io.BytesIO(result.stdout)) as archive:
              metadata = json.loads(archive.read("BUILD-INFO.json"))
          keys = ("version", "source_commit", "source_ref", "architectures",
                  "code_signature", "apple_notarized", "publication_authorized",
                  "archive", "archive_sha256")
          safe = {key: metadata.get(key) for key in keys}
          assert safe["version"] == "0.0.2"
          assert safe["architectures"] == ["arm64"]
          assert safe["publication_authorized"] is False
          assert safe["apple_notarized"] is False
          print(json.dumps({"validation_artifact": safe}))
          PY
