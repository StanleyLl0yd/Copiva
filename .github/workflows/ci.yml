name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS 26 / Swift
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify macOS 26 on the current runner alias
        run: |
          python3 - <<'PY'
          import platform
          version = platform.mac_ver()[0]
          if version.split(".")[0] != "26":
              raise SystemExit(f"Expected macOS 26, got {version}")
          print(f"Verified macOS {version}")
          PY
      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
      - name: Build and test minimum supported toolchain
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun swift package clean
          xcrun swift build
          xcrun swift test --parallel
