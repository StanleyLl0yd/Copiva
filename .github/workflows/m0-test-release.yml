name: Publish M0 macOS test build

on:
  push:
    branches: [release/m0-macos-test]

permissions: {}

concurrency:
  group: copiva-m0-test-release
  cancel-in-progress: false

jobs:
  build:
    name: Package universal M0 application
    if: github.repository == 'StanleyLl0yd/Copiva'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test the supported minimum toolchain
        run: xcrun swift test --parallel
      - name: Package and verify app and ZIP
        id: package
        run: python3 scripts/package_m0_app.py
      - name: Retain only release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/Copiva-*.zip
            dist/BUILD-INFO.json
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false

  publish:
    name: Publish reviewed M0 prerelease
    needs: build
    if: github.repository == 'StanleyLl0yd/Copiva'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
    steps:
      - name: Require reviewed exact-head CI and CodeQL
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time, urllib.parse
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          if repo != "StanleyLl0yd/Copiva" or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Unexpected repository or source SHA")
          if os.environ["GITHUB_REF"] != "refs/heads/release/m0-macos-test":
              raise SystemExit("Only the owner-requested M0 test branch is authorized")
          def api(path):
              result = subprocess.run(["gh", "api", path], check=True, capture_output=True,
                                      text=True, timeout=30)
              return json.loads(result.stdout)
          required = ("macOS 26 / Swift", "Analyze (swift)", "CodeQL")
          deadline = time.monotonic() + 1800
          previous = None
          while time.monotonic() < deadline:
              query = urllib.parse.urlencode({
                  "state": "open", "head": "StanleyLl0yd:release/m0-macos-test", "base": "main"
              })
              prs = api(f"repos/{repo}/pulls?{query}")
              matches = [p for p in prs if p["head"]["sha"] == sha
                         and p["head"]["repo"]["full_name"] == repo and not p["draft"]]
              checks = api(f"repos/{repo}/commits/{sha}/check-runs?per_page=100")
              if checks["total_count"] > 100:
                  raise SystemExit("Unexpected check volume; review pagination before publishing")
              latest = {}
              for check in sorted(checks["check_runs"], key=lambda c: c["id"], reverse=True):
                  name = check["name"]
                  expected_app = {"macOS 26 / Swift": 15368, "Analyze (swift)": 15368,
                                  "CodeQL": 57789}.get(name)
                  if check["head_sha"] == sha and check["app"]["id"] == expected_app:
                      latest.setdefault(name, check)
              status = {name: latest.get(name, {}).get("conclusion")
                        or latest.get(name, {}).get("status", "missing") for name in required}
              review_ok = False
              if len(matches) == 1:
                  reviews = api(f"repos/{repo}/pulls/{matches[0]['number']}/reviews?per_page=100")
                  review_ok = any(r["commit_id"] == sha and r["user"]["login"] == "StanleyLl0yd"
                                  and "M0 release review: packaging and publication inspected"
                                  in (r["body"] or "") for r in reviews)
              current = (status, review_ok)
              if current != previous:
                  print(json.dumps({"checks": status, "exact_head_review": review_ok}), flush=True)
                  previous = current
              if any(value in ("failure", "cancelled", "timed_out", "action_required")
                     for value in status.values()):
                  raise SystemExit("A required exact-head gate did not pass")
              if all(value == "success" for value in status.values()) and review_ok:
                  break
              time.sleep(20)
          else:
              raise SystemExit("Timed out waiting for reviewed exact-head CI and CodeQL")
          commit = api(f"repos/{repo}/git/commits/{sha}")
          expected = {"name": "StanleyLl0yd",
                      "email": "131160519+StanleyLl0yd@users.noreply.github.com"}
          if not all(all(commit[key][field] == value for field, value in expected.items())
                     for key in ("author", "committer")):
              raise SystemExit("Source commit author/committer identity is not approved")
          print("Exact-head CI, CodeQL, review and commit identities verified")
          PY
      - name: Publish immutable owner-requested test build
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          tag = "v0.0.1-m0.1"
          archive = f"Copiva-{tag}-macos-universal.zip"
          if repo != "StanleyLl0yd/Copiva" or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Unexpected release source")
          artifact = os.environ["ARTIFACT_NAME"]
          if not re.fullmatch(r"copiva-m0-" + sha + r"-[0-9]+", artifact):
              raise SystemExit("Unexpected artifact identity")
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, timeout=120, **kwargs)
          def api(path, payload=None, missing=False):
              args = ["gh", "api", path]
              if payload is not None:
                  args += ["--method", "POST", "--input", "-"]
              result = subprocess.run(args, input=json.dumps(payload) if payload else None,
                                      capture_output=True, text=True, timeout=30)
              data = json.loads(result.stdout)
              if result.returncode:
                  if missing and str(data.get("status")) == "404":
                      return None
                  raise SystemExit(f"GitHub API failed: {data.get('message', 'unknown error')}")
              return data
          destination = Path(os.environ["RUNNER_TEMP"]) / "copiva-m0-publish"
          destination.mkdir(exist_ok=False)
          run("gh", "run", "download", os.environ["GITHUB_RUN_ID"], "--repo", repo,
              "--name", artifact, "--dir", str(destination))
          expected_files = {archive, "BUILD-INFO.json", "SHA256SUMS", "RELEASE_NOTES.md"}
          if {p.name for p in destination.iterdir()} != expected_files:
              raise SystemExit("Unexpected artifact files")
          if any(not p.is_file() or p.is_symlink() for p in destination.iterdir()):
              raise SystemExit("Artifact must contain regular files only")
          hashes = {}
          for line in (destination / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              if name not in {archive, "BUILD-INFO.json"} or name in hashes:
                  raise SystemExit("Unexpected checksum entry")
              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("Malformed SHA-256")
              with (destination / name).open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if actual != digest:
                  raise SystemExit("Artifact checksum mismatch")
              hashes[name] = digest
          if set(hashes) != {archive, "BUILD-INFO.json"}:
              raise SystemExit("Missing checksum entry")
          metadata = json.loads((destination / "BUILD-INFO.json").read_text(encoding="utf-8"))
          if (metadata["source_commit"] != sha or metadata["release_tag"] != tag
                  or metadata["source_repository"] != repo
                  or metadata["architectures"] != ["arm64", "x86_64"]
                  or metadata["code_signature"] != "ad-hoc"
                  or metadata["apple_notarized"] is not False
                  or metadata["archive_sha256"] != hashes[archive]):
              raise SystemExit("Build metadata does not match the authorized test release")
          if api(f"repos/{repo}/releases/tags/{tag}", missing=True) is not None:
              raise SystemExit("Release already exists; overwriting is forbidden")
          refs = api(f"repos/{repo}/git/matching-refs/tags/{tag}")
          exact = [r for r in refs if r["ref"] == f"refs/tags/{tag}"]
          if exact and exact[0]["object"]["sha"] != sha:
              raise SystemExit("Immutable tag points to another commit")
          if not exact:
              api(f"repos/{repo}/git/refs", {"ref": f"refs/tags/{tag}", "sha": sha})
          release = api(f"repos/{repo}/releases", {
              "tag_name": tag, "target_commitish": sha,
              "name": "Copiva 0.0.1-m0.1 — M0 test build",
              "body": (destination / "RELEASE_NOTES.md").read_text(encoding="utf-8"),
              "draft": True, "prerelease": True, "make_latest": "false",
          })
          assets = [archive, "BUILD-INFO.json", "SHA256SUMS"]
          run("gh", "release", "upload", tag, "--repo", repo,
              *(str(destination / name) for name in assets))
          uploaded = api(f"repos/{repo}/releases/{release['id']}/assets")
          if {a["name"] for a in uploaded} != set(assets):
              raise SystemExit("Draft release assets differ from the verified build")
          for asset in uploaded:
              result = run("gh", "api", f"repos/{repo}/releases/assets/{asset['id']}",
                           "-H", "Accept: application/octet-stream", stdout=subprocess.PIPE)
              if result.stdout != (destination / asset["name"]).read_bytes():
                  raise SystemExit("Downloaded draft asset differs from the build")
          payload = json.dumps({"draft": False, "prerelease": True, "make_latest": "false"})
          run("gh", "api", f"repos/{repo}/releases/{release['id']}", "--method", "PATCH",
              "--input", "-", input=payload, text=True, stdout=subprocess.DEVNULL)
          public = api(f"repos/{repo}/releases/tags/{tag}")
          if public["draft"] or not public["prerelease"] or public["tag_name"] != tag:
              raise SystemExit("Release publication state is incorrect")
          verify = destination / "public-download"
          verify.mkdir()
          for asset in public["assets"]:
              url = asset["browser_download_url"]
              if not url.startswith(f"https://github.com/{repo}/releases/download/{tag}/"):
                  raise SystemExit("Unexpected public download URL")
              target = verify / asset["name"]
              run("curl", "--fail", "--location", "--retry", "5", "--retry-all-errors",
                  "--retry-delay", "2", "--silent", "--show-error", "--output", str(target), url)
              if target.read_bytes() != (destination / asset["name"]).read_bytes():
                  raise SystemExit("Public release download differs from the build")
          print(public["html_url"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Published and verified M0 test build: {public['html_url']}\n")
          PY
